<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="家計簿">
  <meta name="application-name" content="家計簿">
  <meta name="theme-color" content="#1a73e8">
  <title>家計簿</title>

  <!-- ブラウザタブ・Android用アイコン（SVGデータURI） -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231a73e8'/%3E%3Crect x='42' y='30' width='96' height='120' rx='14' fill='%23ffffff'/%3E%3Crect x='42' y='30' width='18' height='120' rx='6' fill='%231557b0'/%3E%3Ctext x='98' y='108' font-family='sans-serif' font-size='56' font-weight='bold' fill='%231a73e8' text-anchor='middle'%3E%C2%A5%3C/text%3E%3C/svg%3E">
  <!-- iPhoneホーム画面用アイコン（スクリプトで高画質PNGを自動セット） -->
  <link id="appleTouchIcon" rel="apple-touch-icon" sizes="180x180" href="">

  <script>
    // 記憶済みのGASウェブアプリURLを組み込み済み
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwlYYUm64xZ19JTQAWgDhGo4Z_apS6nrQ6MC2x803wLDRHDxl2l2NGDC6EBFhYI5JzRaQ/exec";

    // GAS側コード.gsの APP_SECRET と一致させる合言葉
    const APP_SECRET = "sugahara-kakeibo-2026";

    // iPhoneホーム画面追加用の180x180 PNGアイコンを自動生成
    (function generateAppIcon() {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 180;
        canvas.height = 180;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#1a73e8';
        ctx.fillRect(0, 0, 180, 180);

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(42, 30, 96, 120, 14);
        ctx.fill();

        ctx.fillStyle = '#1557b0';
        ctx.beginPath();
        ctx.roundRect(42, 30, 18, 120, 6);
        ctx.fill();

        ctx.fillStyle = '#1a73e8';
        ctx.font = 'bold 58px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('¥', 98, 94);

        const link = document.getElementById('appleTouchIcon');
        if (link) link.href = canvas.toDataURL('image/png');
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --primary: #1a73e8;
      --edit: #e37400;
      --danger: #d93025;
      --ai: #137333;
      --bg: #f3f5f8;
      --card: #ffffff;
      --text: #222222;
      --sub: #666666;
      --border: #dcdfe6;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 8px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 10px;
    }
    .card.editing-mode {
      border: 2px solid var(--edit);
    }

    /* サマリーカード（スリムで細い高さ） */
    .card.summary-card {
      padding: 7px 10px;
      margin-bottom: 8px;
      border-radius: 10px;
    }
    .summary-header {
      font-size: 11px;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .summary-row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1.25fr;
      gap: 5px;
    }
    .stat-box {
      background: #f8fafd;
      border: 1px solid #e4ebf5;
      border-radius: 6px;
      padding: 4px 4px;
      text-align: center;
    }
    .stat-box.transfer {
      background: #e8f0fe;
      border-color: #d2e3fc;
      color: #174ea6;
    }
    .stat-label { font-size: 9.5px; color: var(--sub); line-height: 1.1; }
    .stat-box.transfer .stat-label { color: #174ea6; font-weight: bold; }
    .stat-val { font-size: 13.5px; font-weight: bold; margin-top: 2px; line-height: 1.1; }

    /* 修正バナー＆上部削除 */
    .edit-banner {
      display: none;
      background: #fef7e0;
      color: #b06000;
      font-size: 12px;
      font-weight: bold;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      justify-content: space-between;
      align-items: center;
    }
    .top-delete-area {
      display: none;
      margin-bottom: 8px;
    }
    .top-delete-btn {
      width: 100%;
      padding: 9px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #f5c2c0;
      background: #fce8e6;
      color: var(--danger);
    }

    /* 支払者＆負担割合（1行横並び） */
    .top-controls-row {
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      gap: 8px;
      margin-bottom: 11px;
    }
    .mini-label {
      font-size: 11px;
      font-weight: bold;
      color: #555;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .payer-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }
    .share-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
    }
    .payer-btn, .share-btn {
      padding: 9px 2px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      background: #fff;
      color: var(--sub);
      white-space: nowrap;
    }
    .share-btn { font-size: 11.5px; }
    .payer-btn.active {
      border-color: var(--primary);
      background: #e8f0fe;
      color: var(--primary);
    }
    .share-btn.active {
      border-color: #137333;
      background: #e6f4ea;
      color: #137333;
    }

    /* レシート撮影エリア（ボタン大型化で押しやすく調整） */
    .receipt-area {
      background: linear-gradient(135deg, #e6f4ea 0%, #e8f0fe 100%);
      border: 1.5px dashed #34a853;
      border-radius: 11px;
      padding: 12px 11px;
      margin-bottom: 11px;
    }
    .receipt-area.loading {
      opacity: 0.7;
      pointer-events: none;
    }
    .receipt-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
      gap: 6px;
    }
    .receipt-title {
      font-size: 13px;
      font-weight: bold;
      color: var(--ai);
    }
    .auto-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #ffffff;
      border: 1px solid #34a853;
      border-radius: 14px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: bold;
      color: var(--ai);
      cursor: pointer;
    }
    .auto-toggle input { margin: 0; accent-color: #137333; }
    .receipt-btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .file-label-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border: 2px solid #34a853;
      color: var(--ai);
      border-radius: 10px;
      padding: 16px 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      overflow: hidden;
      margin: 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.06);
    }
    .file-label-btn:active {
      background: #e6f4ea;
      transform: scale(0.99);
    }
    .file-label-btn.gallery {
      border-color: #1a73e8;
      color: #1a73e8;
    }
    .file-label-btn.gallery:active {
      background: #e8f0fe;
    }
    .file-label-btn input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    #receiptPreview {
      display: none;
      max-height: 64px;
      margin: 8px auto 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    /* フォーム入力欄（iPhoneズーム防止の16px維持＋高さ44px） */
    label.field-label {
      display: block;
      font-size: 11.5px;
      font-weight: bold;
      color: #444;
      margin-top: 11px;
      margin-bottom: 4px;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    input[type="date"], input[type="text"], input[type="number"], select {
      width: 100%;
      height: 44px;
      padding: 6px 10px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }
    .chips {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      background: #f1f3f4;
      border: none;
      border-radius: 14px;
      padding: 6px 11px;
      font-size: 12px;
      color: #333;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .chip:active { background: #dce3ea; }

    button.submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button.submit-btn.is-edit { background-color: var(--edit); }
    button.submit-btn:disabled { opacity: 0.6; }

    .edit-actions {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .sub-btn {
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
      color: #444;
    }
    .sub-btn.delete {
      border-color: #f5c2c0;
      background: #fce8e6;
      color: var(--danger);
    }

    /* 直近履歴 */
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 4px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
      cursor: pointer;
    }
    .history-item:active { background: #f5f7fa; }
    .history-item:last-child { border-bottom: none; }
    .tag {
      display: inline-block;
      background: #eef2f7;
      color: #334155;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      margin-right: 4px;
    }
    .share-badge {
      display: inline-block;
      background: #fef7e0;
      color: #b06000;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      margin-left: 4px;
    }
    .edit-hint {
      font-size: 11px;
      color: var(--primary);
      margin-left: 6px;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #323232;
      color: #fff;
      padding: 10px 18px;
      border-radius: 22px;
      font-size: 13.5px;
      display: none;
      z-index: 100;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 月間サマリー（スリム版・M27連携） -->
    <div class="card summary-card">
      <div class="summary-header">
        <span id="monthTitle">集計読み込み中...</span>
        <span id="refreshBtn" style="cursor:pointer; font-weight:normal;" onclick="loadSummary(true)">↻ 更新</span>
      </div>
      <div class="summary-row-3">
        <div class="stat-box">
          <div class="stat-label">英之 負担</div>
          <div class="stat-val" id="hideyukiSum">-</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">智子 負担</div>
          <div class="stat-val" id="tomokoSum">-</div>
        </div>
        <div class="stat-box transfer">
          <div class="stat-label" id="transferDir">英之振込額</div>
          <div class="stat-val" id="transferVal">-</div>
        </div>
      </div>
    </div>

    <!-- 入力・編集フォーム -->
    <div class="card" id="formCard">
      <div class="edit-banner" id="editBanner">
        <span id="editLabel">修正モード</span>
        <span style="cursor:pointer; text-decoration:underline;" onclick="cancelEdit()">やめる</span>
      </div>

      <div class="top-delete-area" id="topDeleteArea">
        <button type="button" class="top-delete-btn" onclick="confirmDelete()">🗑 この行を削除する</button>
      </div>

      <!-- 支払者 ＆ 負担割合（1行横並び） -->
      <div class="top-controls-row">
        <div>
          <div class="mini-label"><span>支払者</span><span id="accountBadge" style="color:#888; font-weight:normal;"></span></div>
          <div class="payer-group">
            <div class="payer-btn" id="btnHideyuki" onclick="setPayer('英之', true)">英之</div>
            <div class="payer-btn" id="btnTomoko" onclick="setPayer('智子', true)">智子</div>
          </div>
        </div>
        <div>
          <div class="mini-label"><span>負担割合</span></div>
          <div class="share-group">
            <div class="share-btn active" id="shareHalf" onclick="setShareMode('half')">折半</div>
            <div class="share-btn" id="shareHideyuki" onclick="setShareMode('hideyuki')">英之全額</div>
            <div class="share-btn" id="shareTomoko" onclick="setShareMode('tomoko')">智子全額</div>
          </div>
        </div>
      </div>

      <!-- レシート読み取りエリア -->
      <div class="receipt-area" id="receiptBox">
        <div class="receipt-top-row">
          <div class="receipt-title" id="receiptStatusText">🧾 レシート撮影（3枚まで）</div>
          <label class="auto-toggle">
            <input type="checkbox" id="autoRegisterCheck" checked>
            即自動登録
          </label>
        </div>
        <div class="receipt-btn-group">
          <label class="file-label-btn">
            📷 カメラで撮る
            <input type="file" accept="image/*" capture="environment" onchange="handleReceiptFile(event)">
          </label>
          <label class="file-label-btn gallery">
            🖼 写真から選ぶ
            <input type="file" accept="image/*" onchange="handleReceiptFile(event)">
          </label>
        </div>
        <img id="receiptPreview" alt="レシートプレビュー">
      </div>

      <form id="expenseForm">
        <input type="hidden" id="editRow" value="">
        <input type="hidden" id="payer" value="英之">
        <input type="hidden" id="shareMode" value="half">

        <!-- 日付 ＆ 支払金額（2列横並び） -->
        <div class="row-2">
          <div>
            <label class="field-label">日付（基準日）</label>
            <input type="date" id="date" required onchange="onDateChange()">
          </div>
          <div>
            <label class="field-label">支払金額（円）</label>
            <input type="number" id="amount" inputmode="numeric" placeholder="例：1500" required>
          </div>
        </div>

        <!-- 大項目 ＆ 中項目（2列横並び） -->
        <div class="row-2">
          <div>
            <label class="field-label">大項目（B列）</label>
            <select id="majorCategory" onchange="updateMinorOptions()"></select>
          </div>
          <div>
            <label class="field-label">中項目（C列）</label>
            <select id="minorCategory"></select>
          </div>
        </div>

        <!-- 小項目① ＆ 小項目②（2列横並び） -->
        <div class="row-2">
          <div>
            <label class="field-label">小項目①（D列・店名）</label>
            <select id="subItem1"></select>
          </div>
          <div>
            <label class="field-label">小項目②（E列・品目等）</label>
            <input type="text" id="subItem2" placeholder="品目・リスト外店名">
          </div>
        </div>

        <!-- クイック店名チップ（1行横スクロール） -->
        <div class="chips">
          <button type="button" class="chip" onclick="setSub1('')">なし</button>
          <button type="button" class="chip" onclick="setSub1('京阪')">京阪</button>
          <button type="button" class="chip" onclick="setSub1('ライフ')">ライフ</button>
          <button type="button" class="chip" onclick="setSub1('イオン')">イオン</button>
          <button type="button" class="chip" onclick="setSub1('スギ薬局')">スギ薬局</button>
          <button type="button" class="chip" onclick="setSub1('マツキヨ')">マツキヨ</button>
          <button type="button" class="chip" onclick="setSub1('ダイソー')">ダイソー</button>
          <button type="button" class="chip" onclick="setSub1('マクドナルド')">マック</button>
          <button type="button" class="chip" onclick="setSub1('すき家')">すき家</button>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">手動でスプレッドシートに登録</button>

        <div class="edit-actions" id="editActions">
          <button type="button" class="sub-btn" onclick="cancelEdit()">キャンセル</button>
          <button type="button" class="sub-btn delete" onclick="confirmDelete()">この行を削除</button>
        </div>
      </form>
    </div>

    <!-- 直近履歴 -->
    <div class="card">
      <div class="summary-header">
        <span>直近の登録履歴 <span style="font-weight:normal; font-size:11px; color:#666;">（タップで修正）</span></span>
      </div>
      <div id="recentList" style="color:#888; font-size:12.5px;">読み込み中...</div>
    </div>
  </div>

  <div class="toast" id="toast">登録しました！</div>

  <script>
    const CATEGORY_MAP = {
      "食費": ["内食", "外食", "お菓子", "離乳食"],
      "衣料費": ["美弥", "快人"],
      "住居": ["共益・積立金", "修理"],
      "生活用品費": ["雑貨", "家具", "寝具", "家電", "消耗品"],
      "医療費": ["美弥", "快人", "智子"],
      "衛生費": ["衛生消耗品", "治療・医薬品", "散髪"],
      "交通費": ["電車・バス", "ガソリン", "高速", "洗車", "駐車場"],
      "教育費": ["美弥", "快人", "文房具"],
      "娯楽費": ["施設使用料", "DVD", "本", "おもちゃ", "旅行代"],
      "交際費": ["贈答品", "冠婚葬祭"],
      "その他": ["写真", "その他", "NHK", "ハガキ", "宅配"]
    };

    let dynamicSubItem1List = [
      "マクドナルド", "すき家", "なか卯", "ガスト", "丸亀",
      "京阪", "ライフ", "イオン", "スギ薬局", "マツキヨ", "ダイコク",
      "セブンイレブン", "ファミリーマート", "ローソン", "まちおか",
      "ダイソー", "キャンドゥ", "セリア", "高槻", "無印良品",
      "サーティワン", "バースデイ", "アマゾン", "ひらぱー",
      "英会話", "知育教室", "キッズデュオ", "ダンス"
    ];

    let recentCache = [];
    let currentSummaryYm = "";
    let defaultPayer = "英之";

    function validateApiUrl() {
      const url = (GAS_API_URL || "").trim();
      if (!url || !url.startsWith("https://script.google.com/")) {
        throw new Error("GAS_API_URL が正しく設定されていません。");
      }
      return url;
    }

    async function callGasGet(params) {
      const url = validateApiUrl();
      const query = new URLSearchParams({ token: APP_SECRET, ...params }).toString();
      const res = await fetch(`${url}?${query}`, { method: "GET" });
      return await res.json();
    }

    async function callGasPost(bodyObj) {
      const url = validateApiUrl();
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ token: APP_SECRET, ...bodyObj })
      });
      const json = await res.json();
      if (!json.ok) {
        throw new Error(json.error || "GAS側でエラーが発生しました");
      }
      return json;
    }

    function renderSubItem1Select(list) {
      if (Array.isArray(list) && list.length > 0) {
        dynamicSubItem1List = list;
      }
      const sub1Select = document.getElementById('subItem1');
      const currentVal = sub1Select.value;
      sub1Select.innerHTML = '';

      const emptyOpt = document.createElement('option');
      emptyOpt.value = '';
      emptyOpt.textContent = '（指定なし）';
      sub1Select.appendChild(emptyOpt);

      dynamicSubItem1List.forEach(shop => {
        const opt = document.createElement('option');
        opt.value = shop;
        opt.textContent = shop;
        sub1Select.appendChild(opt);
      });

      if (currentVal && dynamicSubItem1List.includes(currentVal)) {
        sub1Select.value = currentVal;
      }
    }

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const paramUser = urlParams.get("user");
      if (paramUser === "tomoko" || paramUser === "智子") {
        defaultPayer = "智子";
        localStorage.setItem("kakeibo_payer", "智子");
      } else if (paramUser === "hideyuki" || paramUser === "英之") {
        defaultPayer = "英之";
        localStorage.setItem("kakeibo_payer", "英之");
      } else {
        const saved = localStorage.getItem("kakeibo_payer");
        if (saved === "英之" || saved === "智子") {
          defaultPayer = saved;
        }
      }
      setPayer(defaultPayer, false);
      setShareMode('half');

      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      document.getElementById('date').value = `${yyyy}-${mm}-${dd}`;

      const majorSelect = document.getElementById('majorCategory');
      Object.keys(CATEGORY_MAP).forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        majorSelect.appendChild(opt);
      });
      updateMinorOptions();
      renderSubItem1Select(dynamicSubItem1List);

      loadSummary(false);
    };

    function updateMinorOptions() {
      const major = document.getElementById('majorCategory').value;
      const minorSelect = document.getElementById('minorCategory');
      minorSelect.innerHTML = '';
      (CATEGORY_MAP[major] || []).forEach(sub => {
        const opt = document.createElement('option');
        opt.value = sub;
        opt.textContent = sub;
        minorSelect.appendChild(opt);
      });
    }

    function handleReceiptFile(event) {
      const inputEl = event.target;
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;

      const isAuto = document.getElementById('autoRegisterCheck').checked;
      const payer = document.getElementById('payer').value;
      const shareMode = document.getElementById('shareMode').value;
      const fallbackDate = document.getElementById('date').value;

      const box = document.getElementById('receiptBox');
      const statusText = document.getElementById('receiptStatusText');
      const preview = document.getElementById('receiptPreview');

      box.classList.add('loading');
      statusText.textContent = isAuto ? '⚡ 解析＆登録中...' : '⚡ 解析中...';

      const objectUrl = URL.createObjectURL(file);
      const img = new Image();
      img.onload = async function() {
        const maxDim = 1024;
        let width = img.width;
        let height = img.height;
        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(objectUrl);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
        preview.src = dataUrl;
        preview.style.display = 'block';

        const base64Data = dataUrl.split(',')[1];

        try {
          if (isAuto) {
            const json = await callGasPost({
              action: "analyzeAndAutoRegister",
              base64Data: base64Data,
              mimeType: "image/jpeg",
              payer: payer,
              shareMode: shareMode,
              fallbackDate: fallbackDate
            });
            const res = json.data;
            if (res.registeredItems && res.registeredItems.length > 0) {
              const lastRegDate = res.registeredItems[res.registeredItems.length - 1].date;
              if (lastRegDate && /^\d{4}-\d{2}-\d{2}$/.test(lastRegDate)) {
                document.getElementById('date').value = lastRegDate;
              }
            }
            renderSummary(res.summary);
            const totalAmount = res.registeredItems.reduce((sum, x) => sum + (Number(x.amount) || 0), 0);
            statusText.textContent = `✅ ${res.registeredCount}件完了（計¥${totalAmount.toLocaleString()}）`;
            setShareMode('half');
            showToast(`${res.registeredCount}件を自動登録しました！`);
          } else {
            const json = await callGasPost({
              action: "analyzeReceipt",
              base64Data: base64Data,
              mimeType: "image/jpeg",
              fallbackDate: fallbackDate
            });
            if (json.items && json.items.length > 0) {
              applySingleReceipt(json.items[0]);
              statusText.textContent = `✅ 読取完了（確認して登録）`;
              showToast('フォームに入力しました');
            }
          }
        } catch (err) {
          alert('エラー: ' + err.message);
          statusText.textContent = '🧾 レシート撮影（3枚まで）';
        } finally {
          box.classList.remove('loading');
          inputEl.value = '';
        }
      };
      img.onerror = function() {
        URL.revokeObjectURL(objectUrl);
        alert('画像の読み込みに失敗しました。');
        box.classList.remove('loading');
        statusText.textContent = '🧾 レシート撮影（3枚まで）';
        inputEl.value = '';
      };
      img.src = objectUrl;
    }

    function applySingleReceipt(res) {
      if (res.date && /^\d{4}-\d{2}-\d{2}$/.test(res.date)) {
        document.getElementById('date').value = res.date;
        onDateChange();
      }
      if (res.majorCategory && CATEGORY_MAP[res.majorCategory]) {
        document.getElementById('majorCategory').value = res.majorCategory;
        updateMinorOptions();
        if (res.minorCategory && CATEGORY_MAP[res.majorCategory].includes(res.minorCategory)) {
          document.getElementById('minorCategory').value = res.minorCategory;
        }
      }
      if (res.subItem1 && dynamicSubItem1List.includes(res.subItem1)) {
        document.getElementById('subItem1').value = res.subItem1;
      } else {
        document.getElementById('subItem1').value = '';
      }
      document.getElementById('subItem2').value = res.subItem2 || '';
      if (res.amount && res.amount > 0) {
        document.getElementById('amount').value = res.amount;
      }
    }
